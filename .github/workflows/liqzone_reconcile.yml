name: liqzone-reconcile (reconcile_daily)

# 清算帯推定 フェーズ1 ステップ3: 直近7日のうち公開済みの日を、Binance公開データで確定(src=bv)に差し替える。
# 公開は約1〜2日遅れ(metrics は翌日07:43 GMT頃、5分足は11:28 GMT頃)。書き込み先は data/liqzone/ のみ。
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: liqzone-data
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconcile with data.binance.vision
        id: reconcile
        run: python3 scripts/liqzone_reconcile.py

      # 収集が止まっていないかを毎日確認する(収集ジョブ自体が動いていない場合の見張り)
      - name: Check data health and notify
        if: always()
        env:
          LIQZONE_DISCORD_WEBHOOK_URL: ${{ secrets.LIQZONE_DISCORD_WEBHOOK_URL }}
        run: python3 scripts/liqzone_check.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name  "oi-recorder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/liqzone
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "liqzone: reconcile $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push失敗、再試行します ($i/3)"
              sleep 5
            done
          fi
