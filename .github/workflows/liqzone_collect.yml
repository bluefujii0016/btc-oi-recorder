name: liqzone-collect (collect_live)

# 清算帯推定 フェーズ1 ステップ1: 毎時、Coinalyze から直近24時間の5分足を重ね取りして
# data/liqzone/raw/ の日別CSVへ上書き追記する。書き込み先は data/liqzone/ のみ。
on:
  schedule:
    # 毎時37分(UTC)。正時・5分刻みは混雑して遅延しやすいため避ける
    - cron: '37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: liqzone-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect 5m bars (24h overlap)
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python3 scripts/liqzone_collect.py

      - name: Commit and push if changed
        run: |
          git config user.name  "oi-recorder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/liqzone
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "liqzone: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push失敗、再試行します ($i/3)"
              sleep 5
            done
          fi
