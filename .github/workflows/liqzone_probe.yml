name: liqzone-probe (step 0)

# 清算帯推定 フェーズ1 ステップ0: 接続と継ぎ目の確認。
# 手動実行のみ。リポジトリには何も書き込まない(読み取り専用)。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run probe
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python3 scripts/liqzone_probe.py
